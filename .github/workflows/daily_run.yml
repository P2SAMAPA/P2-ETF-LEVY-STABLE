name: Daily Lévy Stable Engine

on:
  schedule:
    - cron: "30 02 * * 1-6"   # 22:00 UTC Mon–Fri (after US market close)
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe (ALL / EQUITY_SECTORS / FI_COMMODITIES / COMBINED)"
        required: false
        default: "ALL"

jobs:
  run-levy:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # MLE fitting is slower than other engines

    strategy:
      matrix:
        universe: [EQUITY_SECTORS, FI_COMMODITIES, COMBINED]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Lévy engine — ${{ matrix.universe }}
        env:
          HF_TOKEN:       ${{ secrets.HF_TOKEN }}
          LEVY_UNIVERSE:  ${{ matrix.universe }}
        run: python trainer.py
